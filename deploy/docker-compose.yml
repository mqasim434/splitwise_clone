services:
  api:
    image: ghcr.io/mqasim434/splitwise-api:${IMAGE_TAG:-363af9c}
    container_name: splitwise-api
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - app.env
    restart: unless-stopped
    mem_limit: 400m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s